# Entorno local para desarrollar y probar el pipeline antes de desplegar a Azure.
# Trae Airflow standalone (para el DAG) montando este repo, con dbt+DuckDB
# instalados automaticamente al arrancar (via _PIP_ADDITIONAL_REQUIREMENTS,
# soportado por la imagen oficial de Airflow).
#
# Uso: docker compose up
# Airflow UI: http://localhost:8080 (usuario/clave: admin/admin tras el setup inicial)

services:
  airflow:
    image: apache/airflow:2.9.3-python3.11
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _PIP_ADDITIONAL_REQUIREMENTS=dbt-core==1.8.6 dbt-duckdb==1.8.1 azure-storage-file-datalake==12.16.0
      # Opcionales: solo si quieres que la tarea subir_bronze_a_adls del DAG
      # tambien suba a Azure Data Lake Storage Gen2 (Fase 2) corriendo desde
      # Docker Compose. Si no se setean (valor por defecto vacio), la tarea
      # simplemente los omite y el resto del pipeline sigue igual sobre DuckDB.
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME:-}
      - AZURE_STORAGE_ACCOUNT_KEY=${AZURE_STORAGE_ACCOUNT_KEY:-}
      - AZURE_STORAGE_CONTAINER_BRONZE=${AZURE_STORAGE_CONTAINER_BRONZE:-bronze}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./dbt_project:/opt/airflow/dbt_project
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com &&
               airflow standalone"
